[project]
name = "cv-scan"
version = "1.0.0"
description = "Vietnam Job Market Scanner & AI Synthesizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "google-genai>=0.1.1",
    "playwright>=1.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
